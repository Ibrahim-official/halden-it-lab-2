# p03-laps-gpo-settings.conf — Halden Distribution Ltd. (fictional, isolated home lab)
# What:   the Group Policy and Windows LAPS settings that scripts/06-Deploy-Laps.ps1 and
#         scripts/07-Set-AdminTiering.ps1 apply, written down once so the GPO can be rebuilt
#         and audited. Values follow the P3 plan and Microsoft's Windows LAPS documentation.
# Where:  Workstations OU, Servers OU and Domain Controllers OU in ad.halden.internal
#         (VLAN 10 SERVERS, 192.168.10.0/24). Backed up by the same scripts into configs/gpo-backup.
# Status: designed values only. Nothing here has been applied and nothing has been measured yet.
# Gate:   runs only after scripts/00-Test-AssessmentGate.ps1 confirms the owner's authorisation.
# Notes:  no password, secret or LAPS recovery value belongs in this file. LAPS passwords live in
#         AD, encrypted, readable only by the delegated groups named below (AGENTS.md 4.6).

[GPO:WKS-LAPS-v1]
# Linked to: OU=Workstations,OU=Computers,OU=Halden
BackupDirectory              = Active Directory
PasswordComplexity           = LargeLetters + SmallLetters + Numbers + Specials
PasswordLength               = 20
PasswordAgeDays              = 30
PasswordExpirationProtection = Enabled
ADPasswordEncryptionEnabled  = Enabled
ADAuthorizedDecryptors       = HALDEN\G_Tier2_Helpdesk
PostAuthenticationActions    = ResetPasswordAndLogoff
PostAuthenticationResetDelay = 8 hours

[GPO:SRV-LAPS-v1]
# Linked to: OU=Servers,OU=Halden (member servers FS01, LNX01, CA01)
BackupDirectory              = Active Directory
PasswordComplexity           = LargeLetters + SmallLetters + Numbers + Specials
PasswordLength               = 20
PasswordAgeDays              = 30
PasswordExpirationProtection = Enabled
ADPasswordEncryptionEnabled  = Enabled
ADAuthorizedDecryptors       = HALDEN\G_Tier1_ServerAdmins
PostAuthenticationActions    = ResetPasswordAndLogoff
PostAuthenticationResetDelay = 8 hours

[GPO:DC-LAPS-v1]
# Linked to: OU=Domain Controllers
# Windows LAPS can also back up the Directory Services Restore Mode (DSRM) password per DC.
BackupDirectory              = Active Directory
PasswordComplexity           = LargeLetters + SmallLetters + Numbers + Specials
PasswordLength               = 20
PasswordAgeDays              = 30
ADPasswordEncryptionEnabled  = Enabled
ADAuthorizedDecryptors       = HALDEN\G_Tier0_Admins
BackupDSRMPassword           = Enabled

[GPO:WKS-Tier-DenyLogon-v1]
# Linked to: OU=Workstations,OU=Computers,OU=Halden
# Tier 0 and Tier 1 admin accounts may never sign in to a workstation.
DenyLogonLocally             = G_Tier0_Admins, G_Tier1_Admins
DenyLogonThroughRemoteDesktop = G_Tier0_Admins, G_Tier1_Admins
DenyLogonAsBatchJob          = G_Tier0_Admins, G_Tier1_Admins
DenyLogonAsService           = G_Tier0_Admins, G_Tier1_Admins
AllowLogonLocally            = G_Tier2_Admins, G_AllStaff
AllowLogonThroughRemoteDesktop = G_Tier2_Admins

[GPO:SRV-Tier-DenyLogon-v1]
# Linked to: OU=Servers,OU=Halden
DenyLogonLocally             = G_Tier0_Admins, G_Tier2_Admins
DenyLogonThroughRemoteDesktop = G_Tier0_Admins, G_Tier2_Admins
AllowLogonLocally            = G_Tier1_Admins
AllowLogonThroughRemoteDesktop = G_Tier1_Admins

[GPO:DC-AllowTier0Only-v1]
# Linked to: OU=Domain Controllers
# Only Tier 0 admin accounts (and the built-in break-glass Administrator) may reach a DC.
AllowLogonLocally            = G_Tier0_Admins, Administrators
AllowLogonThroughRemoteDesktop = G_Tier0_Admins, Administrators
DenyLogonThroughRemoteDesktop = G_Tier1_Admins, G_Tier2_Admins

[AccountFlags:AllAdminAccounts]
# Applied to every adm-t{0,1,2}-* account created by 07-Set-AdminTiering.ps1.
AccountNotDelegated          = Enabled
UseDESKeyOnly                = Disabled
DoesNotRequirePreAuth        = Disabled
PasswordNeverExpires         = Disabled
SmartcardRequired            = Not required in this lab; recorded as a future improvement
MemberOfProtectedUsers       = Enforced for human admin accounts only
# Never add service accounts or computer accounts to Protected Users: it blocks the machine and
# service logons they need (P3 plan, common pitfalls).

[Policy:DefaultDomain]
# Raised from the P1 baseline to match NIST 800-63B thinking (length over forced complexity).
MinimumPasswordLength        = 14
LockoutThreshold             = 10
LockoutDuration              = 15 minutes
LockoutObservationWindow     = 15 minutes
ComplexityEnabled            = Enabled
PasswordHistory              = 24

[Policy:FGPP-Admins]
# Fine-Grained Password Policy applied to G_Tier0_Admins and G_Tier1_Admins.
Precedence                   = 10
MinimumPasswordLength        = 20
LockoutThreshold             = 5
LockoutDuration              = 30 minutes
ComplexityEnabled            = Enabled
MaximumPasswordAgeDays       = 180
AppliesTo                    = G_Tier0_Admins, G_Tier1_Admins
