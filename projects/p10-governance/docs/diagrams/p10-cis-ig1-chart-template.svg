<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="p10cTitle p10cDesc" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="p10cTitle">CIS Controls v8.1 IG1 before/after chart — empty template</title>
  <desc id="p10cDesc">An empty before/after bar chart template for the CIS Controls v8.1 IG1 assessment. Each of the fifteen controls that contain IG1 safeguards has two labelled empty bar slots, for the before score and the after score, with the number of IG1 safeguards per control shown underneath. There are no values plotted, because the assessment has not been run.</desc>

  <rect width="1200" height="700" fill="#f8fafc"/>

  <text x="40" y="42" font-size="22" font-weight="700" fill="#0f172a">CIS Controls v8.1 IG1 — implementation before / after</text>
  <text x="40" y="66" font-size="13.5" fill="#475569">Empty template · 56 IG1 safeguards across 15 controls · bars are filled only from real, evidenced scores</text>

  <!-- Warning banner -->
  <rect x="40" y="84" width="1120" height="46" rx="7" fill="#fff7ed" stroke="#b45309"/>
  <text x="58" y="105" font-size="12.5" font-weight="700" fill="#b45309">Not measured yet — this chart deliberately contains no values.</text>
  <text x="58" y="122" font-size="11.5" fill="#92400e">The CIS IG1 self-assessment has not been run, so no control is scored. The bars below stay empty until `scripts/cis_assessment.py` reports real scores with evidence.</text>

  <!-- Chart area -->
  <line x1="120" y1="150" x2="120" y2="540" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="540" x2="1160" y2="540" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Y axis labels: percent implemented -->
