# 13-inventory.ini — Ansible inventory for P5 Linux patching.
# Scope: Halden lab hosts ONLY (AGENTS.md rule R1). The SSH host keys and users are the lab's;
# no passwords are stored here (key-based auth only, as configured in P1).
[halden_linux]
LNX01 ansible_host=192.168.10.30
OPS01 ansible_host=192.168.10.40
SIEM01 ansible_host=192.168.10.41
BKP01 ansible_host=192.168.10.42

[halden_linux:vars]
ansible_user=scanner
ansible_ssh_private_key_file=/root/.ssh/p5-scanner_ed25519
ansible_python_interpreter=/usr/bin/python3
