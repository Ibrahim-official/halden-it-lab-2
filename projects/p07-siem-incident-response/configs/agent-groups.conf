# Halden Distribution Ltd. — P7 Wazuh agent configuration profiles
# Applies to: SIEM01 (Wazuh manager) → /var/ossec/etc/shared/<group>/agent.conf
# Project: P7 · Domain: ad.halden.internal
#
# WHAT THIS IS
#   Wazuh lets one file (agent.conf) define what a whole group of agents collects. Halden uses
#   three groups so that a workstation does not collect DC-only data and a Linux host does not
#   try to read Windows channels:
#
#     windows-servers        DC01, DC02, FS01
#     windows-workstations   WS01, WS02
#     linux-servers          LNX01, OPS01, BKP01 (and SIEM01 itself)
#
#   The deploy script (scripts/06) installs these blocks with `wazuh-remote-agent-config` style
#   placement. Nothing here is a secret.

# =====================================================================================
# GROUP: windows-servers   (DC01, DC02, FS01)
# =====================================================================================
<agent_config>
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-Windows Firewall With Advanced Security/Firewall</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- File integrity monitoring: GPO content is the highest-value tamper target on a DC. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <directories check_all="yes" report_changes="yes" realtime="yes">C:\Windows\SYSVOL\domain\Policies</directories>
    <directories check_all="yes" report_changes="yes">C:\Windows\System32\drivers\etc</directories>
  </syscheck>
</agent_config>

# =====================================================================================
# GROUP: windows-workstations   (WS01, WS02)
# =====================================================================================
<agent_config>
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>

# =====================================================================================
# GROUP: linux-servers   (LNX01, OPS01, BKP01, SIEM01)
# =====================================================================================
<agent_config>
  <localfile>
    <location>/var/log/auth.log</location>
    <log_format>syslog</log_format>
  </localfile>
  <localfile>
    <location>/var/log/syslog</location>
    <log_format>syslog</log_format>
  </localfile>
  <localfile>
    <location>/var/log/audit/audit.log</location>
    <log_format>audit</log_format>
  </localfile>

  <!-- File integrity monitoring on the files that decide who is an administrator. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <directories check_all="yes" report_changes="yes" realtime="yes">/etc/sudoers.d</directories>
    <directories check_all="yes" report_changes="yes">/etc/ssh</directories>
    <directories check_all="yes" report_changes="yes">/etc/passwd,/etc/shadow,/etc/group</directories>
  </syscheck>
</agent_config>
