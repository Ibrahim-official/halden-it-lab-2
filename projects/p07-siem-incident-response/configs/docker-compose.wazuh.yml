# Halden Distribution Ltd. — P7 Wazuh all-in-one deployment (single node)
# Applies to: SIEM01 (Ubuntu Server 24.04, 192.168.10.41, VLAN 10) · Project: P7
#
# WHAT THIS IS
#   A single-node Wazuh 4.x stack (manager + indexer + dashboard) for a lab of this size.
#   It is the *designed* compose file: it contains NO secrets. All passwords/keys are read from
#   an untracked `.env` file generated at deploy time by `scripts/01-Deploy-Wazuh.sh`
#   (openssl rand) and stored in /opt/wazuh on SIEM01, never in Git (AGENTS.md R3).
#
# SIZING (see docs/00-design.md §3 and scripts/00-Prepare-SIEM01.sh)
#   This is the heaviest project in the lab. The indexer alone wants ~4 GB. The owner's host has
#   16 GB, so give SIEM01 6 GB and run the other VMs sparingly while Wazuh is up. Minimum
#   acceptable: 4 GB (slower dashboard). Recommended for a smooth demo: 8 GB.
#
# SECURITY NOTES
#   - The dashboard is published on SIEM01 only and reached from the MGMT network. It is NOT
#     exposed to the internet (AGENTS.md 5.1) and no port-forward exists on FW01 for it.
#   - Default credentials are never used: the deploy script sets random ones into `.env`.

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.9.0
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    ports:
      - "1514:1514"                 # agent enrolment / events (lab LAN only)
      - "1515:1515"                 # agent enrolment service (lab LAN only)
      - "514:514/udp"               # syslog listener for FW01/FW02 (restricted in ossec.conf)
      - "55000:55000"               # Wazuh API (used by scripts 08/09; not published outside the lab)
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      # The custom rules and agent groups are mounted READ-ONLY from the repo copy:
      - ./local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.9.0
    hostname: wazuh.indexer
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"   # half of the container memory; raise with SIEM01 RAM
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=false"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - ./certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem:ro
      - ./certs/indexer.pem:/usr/share/wazuh-indexer/certs/indexer.pem:ro
      - ./certs/indexer-key.pem:/usr/share/wazuh-indexer/certs/indexer-key.pem:ro
      - ./certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem:ro
      - ./certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem:ro

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.9.0
    hostname: wazuh.dashboard
    restart: unless-stopped
    ports:
      - "443:5601"                  # reached from the MGMT network only
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD}
    volumes:
      - ./certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./certs/dashboard.pem:/usr/share/wazuh-dashboard/certs/dashboard.pem:ro
      - ./certs/dashboard-key.pem:/usr/share/wazuh-dashboard/certs/dashboard-key.pem:ro
      - wazuh_dashboard_dashboards:/usr/share/wazuh-dashboard/data/wazuh/config
    depends_on:
      - wazuh.indexer

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  wazuh_indexer_data:
  wazuh_dashboard_dashboards:
