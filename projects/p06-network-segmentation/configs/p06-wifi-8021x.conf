# P6 Wi-Fi 802.1X / EAP-TLS configuration
# What this is: the Wi-Fi design in one place - the corporate SSID that uses 802.1X (EAP-TLS), the
#   guest SSID that is isolated, and the wpa_supplicant profile used to test the corporate SSID
#   from a Linux host without any access-point hardware (via eapol_test).
# Where it applies: the lab access point (if the owner buys one) and the GPO that configures
#   Windows clients; and LNX01 for the eapol_test validation.
# SECRETS: EAP-TLS uses certificates, not passwords. The client certificate private key is
#   generated by the client and never leaves it; only the Halden CA public certificate is shared.
#   No pre-shared key for staff remains after this project - the old shared PSK is retired.

# --- SSIDs -------------------------------------------------------------------------------
# Halden-Corp  : WPA3-Enterprise (WPA2-Enterprise if the AP lacks WPA3), EAP-TLS, VLAN 30
# Halden-Guest : open with a captive portal / voucher, client isolation on, VLAN 50, internet only
#
# Corporate devices are authenticated by certificate against NPS (see p06-nps-radius-policy.md).
# A device without a valid certificate issued by the Halden CA cannot join Halden-Corp at all.
# Operators/reception read the guest terms in ../../business/p06-guest-wifi-notice.md.

# --- Windows client policy (GPO "WKS - Wireless - v1") -----------------------------------
# Applied via scripts/08-Configure-8021xWifi.ps1. Designed settings:
#   SSID                    Halden-Corp
#   Authentication          WPA3-Enterprise (or WPA2-Enterprise)
#   EAP type                Smart Card or other certificate (EAP-TLS)
#   Validate server cert    Enabled, trust only the Halden Root CA
#   Server name             fs01.ad.halden.internal (must match the NPS certificate)
#   Trusted root CA         Halden Root CA (public certificate only)
#   Autoenroll              Computer certificate from template Halden-WiFi-Computer (see CA01 script)

# --- wpa_supplicant profile for eapol_test (run on LNX01) --------------------------------
# Usage (see scripts/10-Test-EapTls.sh):
#   eapol_test -c p06-wifi-8021x.conf -a 192.168.20.20 -s <RADIUS_SHARED_SECRET_FROM_VAULT>
# The shared secret is passed on the command line at run time from the password manager, or read
# from an environment variable. It is NOT written into this file.
network={
    ssid="Halden-Corp"
    key_mgmt=WPA-EAP
    eap=TLS
    identity="host/lnx01.ad.halden.internal"
    # Client certificate issued to LNX01 from the Halden CA (public certificate + its own key).
    ca_cert="/etc/halden-lab/pki/halden-root-ca.pem"
    client_cert="/etc/halden-lab/pki/lnx01-client.pem"
    private_key="/etc/halden-lab/pki/lnx01-client.key"
    private_key_passwd="<PROMPTED_AT_RUN_TIME>"
    # EAP-TLS is a mutual exchange: the server must present a certificate the client trusts,
    # and the client must present one the server trusts. Either side failing is a rejection.
}

# --- What a successful test looks like ---------------------------------------------------
#   eapol_test prints "SUCCESS" when NPS sends Access-Accept. Anything else (a TLS error, a
#   certificate rejection or an Access-Reject) is a failure to investigate, not a pass.
#   The result of that run is recorded in the lab phase only; nothing is claimed here.
