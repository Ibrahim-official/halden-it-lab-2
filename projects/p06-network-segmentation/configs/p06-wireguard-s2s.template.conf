# P6 WireGuard site-to-site tunnel template (HQ FW01 <-> Warehouse FW02)
# What this is: the shape of the site-to-site WireGuard configuration that joins the warehouse
#   (VLAN 20, behind FW02) to the HQ SERVERS zone across the lab.
# Where it applies: applied on FW01 and FW02 in OPNsense (VPN > WireGuard > Instances / Peers).
# SECRETS: WireGuard private keys are generated ON THE DEVICE (wg genkey) and stored only in the
#   owner's password manager. Only the PUBLIC half is entered on the peer. Nothing real below -
#   every key line is a placeholder, and this file must never hold an exported private key.

# --- FW01 (HQ) instance ---------------------------------------------------------------
[Interface]
# Address on the tunnel. Two addresses in one /30, .1 on HQ and .2 on the warehouse.
Address = 10.99.0.1/30
ListenPort = 51820
PrivateKey = <FW01_PRIVATE_KEY_GENERATED_ON_DEVICE_AND_VAULTED>

[Peer]
# FW02 (warehouse)
PublicKey = <FW02_PUBLIC_KEY_FROM_FW02>
# Only the warehouse subnet and the tunnel address route across this link. This is the whole
# point of a site-to-site tunnel: the HQ side learns exactly one remote network.
AllowedIPs = 192.168.20.0/24, 10.99.0.2/32
PersistentKeepalive = 25

# --- FW02 (Warehouse) instance ---------------------------------------------------------
[Interface]
Address = 10.99.0.2/30
ListenPort = 51820
PrivateKey = <FW02_PRIVATE_KEY_GENERATED_ON_DEVICE_AND_VAULTED>

[Peer]
# FW01 (HQ)
PublicKey = <FW01_PUBLIC_KEY_FROM_FW01>
# The warehouse may reach the HQ server subnet and the tunnel address only.
AllowedIPs = 192.168.10.0/24, 10.99.0.1/32
PersistentKeepalive = 25

# --- Routing and firewall on the tunnel interface (default deny still applies) ----------
#   FW01: interface wg1 (or the OPNsense-assigned name), allow WAREHOUSE_NET -> DCs / FS01 / OPS01
#         on AD and file ports only; deny everything else. This is matrix rules 12 and 13.
#   FW02: allow VLAN 20 -> the same HQ destinations; deny the rest. Allow UDP 51820 inbound on
#         each firewall's WAN so the peers can bring the tunnel up.
#   Static gateway on each side points the remote /24 at the tunnel interface.

# --- Verification (to be run in the lab, results pasted into docs/as-built.md) ----------
#   wg show                       -> latest-handshakes recent on both peers
#   ping across the tunnel        -> tunnel reachability
#   on a warehouse client: ipconfig /all (DHCP via the relay), nltest /dsgetsite -> WAREHOUSE
#   map a drive to FS01 and open a file -> cross-site AD authentication works
