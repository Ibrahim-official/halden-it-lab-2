<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="p2Title p2Desc" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="p2Title">Halden Distribution P2 identity lifecycle and access governance architecture</title>
  <desc id="p2Desc">A synthetic HR source-of-truth export feeds a PowerShell joiner-mover-leaver engine that keeps Active Directory, AGDLP role groups and file access aligned, records every action to an append-only audit log and snapshots leaver groups. Identities are synced to Microsoft Entra ID, where Conditional Access enforces MFA, blocks legacy authentication, excludes monitored break-glass accounts and is assessed with CISA ScubaGear. A second panel compares the manual as-is joiner-mover-leaver process with the automated to-be process.</desc>

  <rect width="1200" height="700" fill="#f8fafc"/>

  <text x="40" y="42" font-size="22" font-weight="700" fill="#0f172a">Halden Distribution Ltd — P2 identity lifecycle and access governance</text>
  <text x="40" y="66" font-size="13.5" fill="#475569">Isolated home lab · HR file to AD to Microsoft Entra ID · domain ad.halden.internal · cloud work runs inside the 30-day M365 Business Premium trial</text>

  <text x="40" y="100" font-size="13" font-weight="700" fill="#0f766e">1 · On-premises lifecycle (source of truth to access)</text>
  <text x="905" y="100" font-size="13" font-weight="700" fill="#0f766e">2 · Hybrid identity and enforcement</text>

  <!-- HR export -->
  <rect x="40" y="110" width="230" height="72" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="155" y="134" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">HR system export</text>
  <text x="155" y="153" font-size="11.5" fill="#334155" text-anchor="middle">data/hr-export.csv · nightly</text>
  <text x="155" y="171" font-size="11.5" fill="#64748b" text-anchor="middle">keyed on EmployeeID · SYNTHETIC</text>

  <!-- Exception requests -->
  <rect x="40" y="194" width="230" height="72" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="155" y="218" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Exception request</text>
  <text x="155" y="237" font-size="11.5" fill="#334155" text-anchor="middle">GLPI / request form</text>
  <text x="155" y="255" font-size="11.5" fill="#64748b" text-anchor="middle">approved by the department head</text>

  <!-- Arrows into engine -->
  <line x1="270" y1="146" x2="305" y2="162" stroke="#0f766e" stroke-width="2"/>
  <polygon points="305,162 296,159 300,152" fill="#0f766e"/>
  <line x1="270" y1="230" x2="305" y2="214" stroke="#0f766e" stroke-width="2"/>
  <polygon points="305,214 300,223 296,216" fill="#0f766e"/>

  <!-- Engine -->
  <rect x="305" y="110" width="280" height="156" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="445" y="134" font-size="13.5" font-weight="700" fill="#0f766e" text-anchor="middle">Invoke-HaldenJML.ps1</text>
  <text x="445" y="153" font-size="11.5" fill="#334155" text-anchor="middle">diffs HR desired state against AD</text>
  <g font-size="11" fill="#134e4a">
    <rect x="317" y="166" width="256" height="26" rx="4" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="445" y="183" text-anchor="middle">-WhatIf dry run · circuit breaker &gt;10 % disables</text>
    <rect x="317" y="198" width="256" height="26" rx="4" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="445" y="215" text-anchor="middle">protected list · runs as delegated gMSA</text>
  </g>
  <g text-anchor="middle" font-size="11.5" font-weight="700">
    <rect x="317" y="232" width="80" height="26" rx="4" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="357" y="249" fill="#134e4a">JOINER</text>
    <rect x="405" y="232" width="80" height="26" rx="4" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="445" y="249" fill="#134e4a">MOVER</text>
    <rect x="493" y="232" width="80" height="26" rx="4" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="533" y="249" fill="#134e4a">LEAVER</text>
  </g>

  <!-- Engine to AD -->
  <line x1="585" y1="170" x2="620" y2="170" stroke="#0f766e" stroke-width="2"/>
  <polygon points="620,170 611,166 611,174" fill="#0f766e"/>

  <!-- AD DS -->
  <rect x="620" y="110" width="250" height="156" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="745" y="134" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Active Directory (P1)</text>
  <text x="745" y="155" font-size="11.5" fill="#334155" text-anchor="middle">department OUs · AGDLP G_ / DL_ groups</text>
  <text x="745" y="174" font-size="11.5" fill="#334155" text-anchor="middle">FS01 home drives and shares</text>
  <text x="745" y="193" font-size="11.5" fill="#334155" text-anchor="middle">OU=Disabled for leavers</text>
  <text x="745" y="212" font-size="11.5" fill="#64748b" text-anchor="middle">extensionAttribute1 = JML-Managed</text>
  <text x="745" y="240" font-size="11.5" fill="#0f766e" text-anchor="middle">identity-hygiene report (phase 2)</text>
  <text x="745" y="258" font-size="11.5" fill="#0f766e" text-anchor="middle">access-review export (phase 4)</text>

  <!-- Audit strip -->
  <rect x="40" y="352" width="830" height="52" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="56" y="374" font-size="12.5" font-weight="700" fill="#0f172a">Evidence and audit trail (append-only)</text>
  <text x="56" y="393" font-size="11.5" fill="#334155">logs/jml-audit.csv — timestamp, action, target, before, after, operator · logs/leavers/&lt;EmployeeID&gt;.json · reports/orphans.csv · reports/identity-hygiene-&lt;date&gt;.html</text>
  <line x1="445" y1="266" x2="445" y2="352" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="745" y1="266" x2="745" y2="352" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- AD to Cloud Sync -->
  <line x1="870" y1="127" x2="905" y2="127" stroke="#0f766e" stroke-width="2"/>
  <polygon points="905,127 896,123 896,131" fill="#0f766e"/>

  <!-- Cloud Sync -->
  <rect x="905" y="110" width="255" height="66" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="1032" y="133" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">Entra Cloud Sync (FS01)</text>
  <text x="1032" y="151" font-size="11.5" fill="#334155" text-anchor="middle">scope: OU=Users,OU=Halden only</text>
  <text x="1032" y="168" font-size="11.5" fill="#64748b" text-anchor="middle">excludes _Admin and ServiceAccounts</text>

  <line x1="1032" y1="176" x2="1032" y2="196" stroke="#0f766e" stroke-width="2"/>
  <polygon points="1032,196 1028,187 1036,187" fill="#0f766e"/>

  <!-- Entra ID -->
  <rect x="905" y="196" width="255" height="78" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1032" y="219" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="middle">Microsoft Entra ID</text>
  <text x="1032" y="238" font-size="11.5" fill="#334155" text-anchor="middle">hybrid users · security groups · licences</text>
  <text x="1032" y="256" font-size="11.5" fill="#64748b" text-anchor="middle">admin accounts stay cloud-only (Tier 0)</text>

  <line x1="1032" y1="274" x2="1032" y2="294" stroke="#0f766e" stroke-width="2"/>
  <polygon points="1032,294 1028,285 1036,285" fill="#0f766e"/>

  <!-- Conditional Access -->
  <rect x="905" y="294" width="255" height="78" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="1032" y="317" font-size="13" font-weight="700" fill="#0f766e" text-anchor="middle">Conditional Access CA001–CA005</text>
  <text x="1032" y="336" font-size="11.5" fill="#334155" text-anchor="middle">MFA for all users · block legacy auth</text>
  <text x="1032" y="354" font-size="11.5" fill="#334155" text-anchor="middle">phishing-resistant MFA for admins · locations</text>
  <text x="1032" y="368" font-size="11" fill="#64748b" text-anchor="middle">report-only first, then enforced</text>

  <!-- Break-glass and ScubaGear -->
  <rect x="905" y="388" width="122" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="966" y="408" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">2 break-glass</text>
  <text x="966" y="424" font-size="10.5" fill="#64748b" text-anchor="middle">excluded · monitored</text>
  <rect x="1038" y="388" width="122" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1099" y="408" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">ScubaGear</text>
  <text x="1099" y="424" font-size="10.5" fill="#64748b" text-anchor="middle">before / after</text>
  <line x1="1032" y1="372" x2="966" y2="388" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="1032" y1="372" x2="1099" y2="388" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Process comparison -->
  <text x="40" y="452" font-size="13" font-weight="700" fill="#0f766e">3 · Process: as-is → to-be (joiner, mover and leaver)</text>

  <rect x="40" y="466" width="540" height="170" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="60" y="490" font-size="12.5" font-weight="700" fill="#b91c1c">AS-IS — manual, email-driven, not evidenced</text>
  <g font-size="11.5" fill="#334155">
    <text x="60" y="514">HR emails IT when someone joins, moves or leaves — sometimes.</text>
    <text x="60" y="536">Joiner — HR to line manager to IT to the worker; new starters wait for access.</text>
    <text x="60" y="558">Mover — a new role is added but the old department access is rarely removed.</text>
    <text x="60" y="580">Leaver — the account stays enabled until somebody remembers to raise it.</text>
    <text x="60" y="602">No 1-to-1 record of what a leaver could reach, and no MFA on the account.</text>
    <text x="60" y="624" fill="#b91c1c">Failure points: hidden handoffs, no SLA, permission creep, orphaned accounts.</text>
  </g>

  <rect x="620" y="466" width="540" height="170" rx="8" fill="#ffffff" stroke="#0f766e"/>
  <text x="640" y="490" font-size="12.5" font-weight="700" fill="#0f766e">TO-BE — one source of truth, automated, audited</text>
  <g font-size="11.5" fill="#334155">
    <text x="640" y="514">HR updates the export; the engine reconciles AD to it and logs every change.</text>
    <text x="640" y="536">Joiner — account, role groups, home drive and licence ready before day 1.</text>
    <text x="640" y="558">Mover — old-department groups are removed and new ones added in the same run.</text>
    <text x="640" y="580">Leaver — disabled, groups stripped and captured, sessions revoked, moved to Disabled.</text>
    <text x="640" y="602">Departments review access quarterly and sign off every removal.</text>
    <text x="640" y="624" fill="#0f766e">Agreed SLAs: joiner by day −1 · mover same day · leaver within 15 minutes.</text>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#475569">
    <rect x="40" y="648" width="14" height="14" rx="3" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <text x="62" y="660">automation / control</text>
    <rect x="210" y="648" width="14" height="14" rx="3" fill="#ffffff" stroke="#94a3b8"/>
    <text x="232" y="660">data store</text>
    <rect x="330" y="648" width="14" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="352" y="660">evidence / supporting control</text>
    <line x1="540" y1="655" x2="574" y2="655" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="582" y="660">writes to the audit trail</text>
  </g>

  <text x="40" y="686" font-size="11" fill="#64748b">Lab note: Halden Distribution Ltd. is a fictional company and the 85-user HR file is synthetic. Configurations are real; every figure published for this project comes from a real run in the isolated lab and is labelled "not measured" until then.</text>
</svg>
