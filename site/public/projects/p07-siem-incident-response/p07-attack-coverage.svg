<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="p7AttTitle p7AttDesc" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="p7AttTitle">Halden P7 ATT&amp;CK detection coverage heat map — mapped, not yet validated</title>
  <desc id="p7AttDesc">A heat map of the fourteen MITRE ATT&amp;CK techniques the Halden lab has a custom detection rule for, grouped by tactic. Cells are derived from the project&apos;s own attack-mapping.csv. Each cell shows the technique ID, the matching detection and an empty validation state, because the detections have not yet been run in a validation exercise.</desc>

  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#0f172a">Halden P7 — ATT&amp;CK detection coverage (mapped)</text>
  <text x="40" y="66" font-size="13.5" fill="#475569">Every cell is derived from data/attack-mapping.csv, which is derived from configs/local_rules.xml. MAPPED coverage only — validated coverage is filled in after an approved lab run.</text>

  <!-- Legend -->
  <rect x="40" y="84" width="14" height="14" rx="3" fill="#0f766e"/>
  <text x="60" y="96" font-size="12" fill="#334155">rule exists (mapped)</text>
  <rect x="220" y="84" width="14" height="14" rx="3" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="240" y="96" font-size="12" fill="#334155">no rule</text>
  <text x="360" y="96" font-size="12" fill="#64748b">Validation ☐ is deliberately empty everywhere until a real, approved simulation has run.</text>

  <!-- ===================== Tactic columns ===================== -->
  <!-- Column headers -->
  <text x="120" y="140" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Initial</text>
  <text x="120" y="156" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Access</text>
  <text x="260" y="140" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Execution</text>
  <text x="400" y="140" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Persistence</text>
  <text x="540" y="140" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Priv. Esc.</text>
  <text x="680" y="140" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Defence</text>
  <text x="680" y="156" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Evasion</text>
  <text x="820" y="140" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Credential</text>
  <text x="820" y="156" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Access</text>
  <text x="960" y="140" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Discovery</text>
  <text x="1100" y="140" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Impact</text>

  <!-- Column separators -->
  <line x1="190" y1="170" x2="190" y2="650" stroke="#e2e8f0"/>
  <line x1="330" y1="170" x2="330" y2="650" stroke="#e2e8f0"/>
  <line x1="470" y1="170" x2="470" y2="650" stroke="#e2e8f0"/>
  <line x1="610" y1="170" x2="610" y2="650" stroke="#e2e8f0"/>
  <line x1="750" y1="170" x2="750" y2="650" stroke="#e2e8f0"/>
  <line x1="890" y1="170" x2="890" y2="650" stroke="#e2e8f0"/>
  <line x1="1030" y1="170" x2="1030" y2="650" stroke="#e2e8f0"/>

  <!-- Initial Access -->
  <g>
    <rect x="52" y="180" width="132" height="76" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="64" y="204" font-size="13" font-weight="700" fill="#0f172a">T1133</text>
    <text x="64" y="222" font-size="10.5" fill="#334155">External Remote Svcs</text>
    <text x="64" y="238" font-size="10.5" fill="#0f766e">D12 · rule 100113</text>
    <text x="64" y="252" font-size="10" fill="#64748b">Validated ☐</text>
  </g>

  <!-- Execution -->
  <g>
    <rect x="202" y="180" width="112" height="76" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="212" y="204" font-size="13" font-weight="700" fill="#0f172a">T1059.001</text>
    <text x="212" y="222" font-size="10.5" fill="#334155">PowerShell</text>
    <text x="212" y="238" font-size="10.5" fill="#0f766e">D6 · 100106</text>
    <text x="212" y="252" font-size="10" fill="#64748b">Validated ☐</text>

    <rect x="322" y="180" width="132" height="76" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="332" y="204" font-size="13" font-weight="700" fill="#0f172a">T1053.005</text>
    <text x="332" y="222" font-size="10.5" fill="#334155">Scheduled Task</text>
    <text x="332" y="238" font-size="10.5" fill="#0f766e">D9b · rule 100110</text>
    <text x="332" y="252" font-size="10" fill="#64748b">Validated ☐</text>

    <rect x="202" y="270" width="252" height="76" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="212" y="294" font-size="13" font-weight="700" fill="#0f172a">T1204.002</text>
    <text x="212" y="312" font-size="10.5" fill="#334155">User Execution: Malicious File</text>
    <text x="212" y="328" font-size="10.5" fill="#0f766e">D13 · rule 100114 (Defender / ASR block)</text>
    <text x="212" y="342" font-size="10" fill="#64748b">Validated ☐</text>
  </g>

  <!-- Persistence -->
  <g>
    <rect x="482" y="180" width="112" height="76" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="492" y="204" font-size="13" font-weight="700" fill="#0f172a">T1098</text>
    <text x="492" y="222" font-size="10.5" fill="#334155">Account Manip.</text>
    <text x="492" y="238" font-size="10.5" fill="#0f766e">D1 · 100100</text>
    <text x="492" y="252" font-size="10" fill="#64748b">Validated ☐</text>

    <rect x="482" y="270" width="112" height="76" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="492" y="294" font-size="13" font-weight="700" fill="#0f172a">T1543.003</text>
    <text x="492" y="312" font-size="10.5" fill="#334155">Windows Service</text>
    <text x="492" y="328" font-size="10.5" fill="#0f766e">D9 · 100109</text>
    <text x="492" y="342" font-size="10" fill="#64748b">Validated ☐</text>

    <rect x="482" y="360" width="112" height="76" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="492" y="384" font-size="13" font-weight="700" fill="#0f172a">T1078</text>
    <text x="492" y="402" font-size="10.5" fill="#334155">Valid Accounts</text>
    <text x="492" y="418" font-size="10.5" fill="#0f766e">D10 · 100111</text>
    <text x="492" y="432" font-size="10" fill="#64748b">Validated ☐</text>
  </g>

  <!-- Privilege Escalation (no rule yet) -->
  <rect x="622" y="180" width="112" height="76" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="632" y="214" font-size="11.5" fill="#475569">No dedicated rule</text>
  <text x="632" y="234" font-size="10" fill="#64748b">(identity rules cover</text>
  <text x="632" y="248" font-size="10" fill="#64748b">the common paths)</text>

  <!-- Defence Evasion -->
  <g>
    <rect x="762" y="180" width="112" height="76" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="772" y="204" font-size="13" font-weight="700" fill="#0f172a">T1070.001</text>
    <text x="772" y="222" font-size="10.5" fill="#334155">Clear Event Logs</text>
    <text x="772" y="238" font-size="10.5" fill="#0f766e">D8 · 100108</text>
    <text x="772" y="252" font-size="10" fill="#64748b">Validated ☐</text>
  </g>

  <!-- Credential Access -->
  <g>
    <rect x="902" y="180" width="112" height="76" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="912" y="204" font-size="13" font-weight="700" fill="#0f172a">T1003.001</text>
    <text x="912" y="222" font-size="10.5" fill="#334155">LSASS Memory</text>
    <text x="912" y="238" font-size="10.5" fill="#0f766e">D5 · 100104</text>
    <text x="912" y="252" font-size="10" fill="#64748b">Validated ☐</text>

    <rect x="902" y="270" width="112" height="76" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="912" y="294" font-size="13" font-weight="700" fill="#0f172a">T1003.006</text>
    <text x="912" y="312" font-size="10.5" fill="#334155">DCSync</text>
    <text x="912" y="328" font-size="10.5" fill="#0f766e">D11 · 100105</text>
    <text x="912" y="342" font-size="10" fill="#64748b">Validated ☐</text>

    <rect x="902" y="360" width="112" height="76" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="912" y="384" font-size="13" font-weight="700" fill="#0f172a">T1110.003</text>
    <text x="912" y="402" font-size="10.5" fill="#334155">Password Spray</text>
    <text x="912" y="418" font-size="10.5" fill="#0f766e">D4 · 100112</text>
    <text x="912" y="432" font-size="10" fill="#64748b">Validated ☐</text>

    <rect x="902" y="450" width="112" height="76" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="912" y="474" font-size="13" font-weight="700" fill="#0f172a">T1558.003</text>
    <text x="912" y="492" font-size="10.5" fill="#334155">Kerberoasting</text>
    <text x="912" y="508" font-size="10.5" fill="#0f766e">D2 · 100102</text>
    <text x="912" y="522" font-size="10" fill="#64748b">Validated ☐</text>

    <rect x="902" y="540" width="112" height="76" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="912" y="564" font-size="13" font-weight="700" fill="#0f172a">T1558.004</text>
    <text x="912" y="582" font-size="10.5" fill="#334155">AS-REP Roasting</text>
    <text x="912" y="598" font-size="10.5" fill="#0f766e">D3 · 100103</text>
    <text x="912" y="612" font-size="10" fill="#64748b">Validated ☐</text>
  </g>

  <!-- Discovery (no rule yet) -->
  <rect x="1042" y="180" width="112" height="76" rx="6" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="1052" y="214" font-size="11.5" fill="#475569">No dedicated rule</text>
  <text x="1052" y="234" font-size="10" fill="#64748b">(Sysmon gives the</text>
  <text x="1052" y="248" font-size="10" fill="#64748b">raw data if needed)</text>

  <!-- Impact -->
  <g>
    <rect x="1042" y="270" width="112" height="76" rx="6" fill="#f0fdfa" stroke="#0f766e"/>
    <text x="1052" y="294" font-size="13" font-weight="700" fill="#0f172a">T1490</text>
    <text x="1052" y="312" font-size="10.5" fill="#334155">Inhibit Recovery</text>
    <text x="1052" y="328" font-size="10.5" fill="#0f766e">D7 · 100107</text>
    <text x="1052" y="342" font-size="10" fill="#64748b">Validated ☐</text>
  </g>

  <!-- Availability (not ATT&amp;CK) -->
  <rect x="52" y="450" width="432" height="90" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="64" y="474" font-size="12.5" font-weight="700" fill="#7c2d12">Availability checks — deliberately NOT ATT&amp;CK</text>
  <text x="64" y="496" font-size="11" fill="#7c2d12">D14 backup job failed (rule 100115) · D15 agent stopped reporting (rule 100116)</text>
  <text x="64" y="516" font-size="11" fill="#9a3412">These are not attacker behaviour, so forcing them into a technique would be dishonest.</text>
  <text x="64" y="532" font-size="11" fill="#64748b">Validated ☐</text>

  <!-- Tally -->
  <rect x="502" y="450" width="240" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="514" y="474" font-size="12.5" font-weight="700" fill="#0f172a">Mapped earlier in the map</text>
  <text x="514" y="498" font-size="11.5" fill="#334155">Our detections concentrate on the</text>
  <text x="514" y="516" font-size="11.5" fill="#334155">stages a small business is most often</text>
  <text x="514" y="534" font-size="11.5" fill="#334155">hit: initial access, credential access</text>
  <text x="514" y="552" font-size="11.5" fill="#334155">and impact.</text>

  <text x="40" y="632" font-size="11" fill="#475569">14 techniques mapped across 16 custom rules. The heat map shows where a rule exists, not that it has fired — validation is measured separately and recorded in configs/detection-coverage-matrix.csv.</text>
  <text x="40" y="652" font-size="10.5" fill="#64748b">Halden Distribution Ltd. is a fictional company. Every technique here was exercised only in an authorised, snapshotted lab test on the owner's own isolated lab.</text>
  <text x="40" y="672" font-size="10.5" fill="#64748b">Source: data/attack-mapping.csv (technique, tactic, rule id). Derived from configs/local_rules.xml so the map cannot drift from the rules.</text>
</svg>
